<html lang="en">

<style>
:root{color-scheme:dark;--bg:#0b1015;--panel:#111920;--panel2:#151f27;--ink:#edf5f4;--muted:#9aabae;--line:#26363c;--accent:#7cf5cb;--accent2:#a6b8ff;--shadow:0 18px 50px #0003;--radius:20px}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f6f4;--panel:#fff;--panel2:#eaf2ee;--ink:#142521;--muted:#526963;--line:#d8e3dd;--accent:#087c5b;--accent2:#485bc7;--shadow:0 18px 50px #19372b12}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Manrope,system-ui,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 12% 4%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 36%),radial-gradient(ellipse at 88% 22%,color-mix(in srgb,var(--accent2) 9%,transparent),transparent 32%)}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.wrap{width:min(1100px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
nav{height:72px;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.08em;text-decoration:none;display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--accent);color:#07130f;display:grid;place-items:center;font-size:.95rem;box-shadow:0 0 25px color-mix(in srgb,var(--accent) 20%,transparent)}
nav a.tab{font-size:.9rem;color:var(--muted);text-decoration:none;transition:color .2s}
nav a.tab:hover,nav a.tab[aria-current]{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:10px}
.pill-button{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:999px;font-size:.82rem;transition:transform .2s,border-color .2s}
.pill-button:hover{transform:translateY(-2px);border-color:var(--accent)}
.hero{min-height:590px;display:grid;grid-template-columns:1.35fr .65fr;align-items:center;gap:55px;padding:85px 0 75px}
.eyebrow{font:500 .76rem "DM Mono",monospace;text-transform:uppercase;letter-spacing:.15em;color:var(--accent);display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";width:25px;height:1px;background:currentColor}
h1,h2,h3,h4,p{margin-top:0}
h1{font-size:clamp(3.1rem,7vw,6.4rem);letter-spacing:-.085em;line-height:.99;margin:22px 0 25px;font-weight:800}
.gradient{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy{font-size:1.08rem;max-width:620px;color:var(--muted)}
.hero-copy strong{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.9rem;transition:transform .2s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-3px);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#07140f;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.profile-card{position:relative;border:1px solid var(--line);border-radius:26px;padding:25px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel2) 65%,var(--bg)));box-shadow:var(--shadow);transform:rotate(2deg);transition:transform .35s}
.profile-card:hover{transform:rotate(0) translateY(-5px)}
.profile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.status{display:inline-flex;align-items:center;gap:8px;font: .75rem "DM Mono",monospace;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite}
.card-symbol{height:130px;border-radius:18px;background:linear-gradient(135deg,#183c38,#1b2443);display:grid;place-items:center;overflow:hidden;position:relative}
.card-symbol:before,.card-symbol:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #7cf5cb55;border-radius:42%;animation:spin 18s linear infinite}
.card-symbol:after{width:130px;height:130px;border-color:#a6b8ff88;animation-direction:reverse;animation-duration:12s}
.symbol{font-size:3.2rem;color:#7cf5cb;z-index:1;font-weight:800;letter-spacing:-.1em}
.profile-card h3{font-size:1.25rem;margin:20px 0 4px}
.profile-card p{font-size:.9rem;color:var(--muted);margin:0}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{padding:12px 10px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:1.2rem;letter-spacing:-.05em}
.stat span{font-size:.68rem;color:var(--muted)}
section{padding:70px 0;border-top:1px solid var(--line)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}
.kicker{font: .72rem "DM Mono",monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px}
h2{font-size:clamp(2rem,4vw,3rem);line-height:1.1;letter-spacing:-.07em;margin-bottom:10px}
.lede{color:var(--muted);max-width:620px;margin:0}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.info-panel{padding:25px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.info-panel h3{font-size:1rem;margin-bottom:12px}
.info-panel p{color:var(--muted);margin-bottom:0}
.skill-list{display:flex;flex-wrap:wrap;gap:8px}
.skill{border:1px solid var(--line);background:var(--bg);padding:7px 10px;border-radius:9px;font-size:.78rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 28px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 13px;border-radius:999px;font-size:.82rem;transition:all .2s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);color:#07140f;border-color:var(--accent);font-weight:700}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.project{display:flex;flex-direction:column;min-height:270px;padding:21px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-decoration:none;position:relative;overflow:hidden;transition:transform .25s,border-color .25s,background .25s}
.project:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--accent) 10%,transparent),transparent 48%);opacity:0;transition:opacity .25s}
.project:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 65%,var(--line));background:var(--panel2)}
.project:hover:before{opacity:1}
.project>*{position:relative}
.project-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}
.project-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1.1rem}
.project-domain{font: .65rem "DM Mono",monospace;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.project h3{font-size:1.08rem;line-height:1.35;letter-spacing:-.035em;margin-bottom:10px}
.project p{font-size:.85rem;line-height:1.65;color:var(--muted);margin-bottom:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font-size:.68rem;padding:4px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.project-arrow{position:absolute;right:20px;bottom:19px;color:var(--accent);font-size:1.1rem;opacity:0;transform:translate(-4px,4px);transition:.2s}
.project:hover .project-arrow{opacity:1;transform:translate(0,0)}
.project-detail{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:clamp(22px,4vw,40px);margin-top:20px;animation:fadeUp .35s ease both}
.project-detail h3{font-size:1.8rem;letter-spacing:-.06em;margin:10px 0}
.project-detail p,.project-detail li{color:var(--muted)}
.project-detail ul{padding-left:20px}
.detail-head{display:flex;justify-content:space-between;align-items:start;gap:15px}
.close-detail{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 12px}
.detail-links{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.empty{color:var(--muted);font-size:.9rem}
.contact-panel{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:clamp(25px,5vw,48px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(125deg,var(--panel),var(--panel2))}
.contact-panel h2{max-width:560px}
.contact-panel p{color:var(--muted);margin-bottom:0}
footer{padding:27px 0 35px;color:var(--muted);font-size:.8rem}
.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}
footer a{color:var(--ink);text-decoration:none}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.hero{grid-template-columns:1fr .7fr;gap:28px}.project-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:520px}}
@media(max-width:650px){.wrap{width:min(100% - 28px,1100px)}nav{height:64px;gap:15px}.brand{font-size:1.15rem}nav a.tab{font-size:.8rem}.nav-right .pill-button{padding:7px 9px}.hero{display:flex;flex-direction:column;align-items:stretch;padding:65px 0 55px;gap:35px;min-height:unset}.hero h1{font-size:clamp(3.2rem,15vw,5rem)}.profile-card{max-width:430px;transform:none;width:100%;align-self:center}.section-head{display:block}.section-head .lede{margin-top:10px}.about-grid{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr}.project{min-height:230px}.contact-panel{display:block}.contact-panel .actions{margin-top:22px}.footer-inner{align-items:flex-start;flex-direction:column;gap:5px}}
@media(max-width:390px){nav{gap:10px}.brand-mark{width:29px;height:29px}.brand{gap:7px}nav a.tab{font-size:.74rem}.nav-right .pill-button{font-size:.72rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<header><div class="wrap"><nav aria-label="Main navigation">

<script>
const PROFILE={
 name:"Kik",
 intro:"Computer science student, curious builder, and fan of software that works end to end.",

const PROJECTS=[
{id:"rasoi",title:"Rasoi — household management agent",domain:"AI / Agents",icon:"✳",summary:"An AI agent for meal planning and grocery management around diet, allergies, pantry stock and budget.",stack:["Python","FastAPI","React","PostgreSQL","Docker","Gemini"],details:"A student project exploring how an agent can turn household preferences and pantry inventory into meal plans and grocery tasks, with human approval before sensitive actions.",features:["Meal plans based on dietary preferences, allergies and budget","Pantry tracking, grocery lists and ingredient substitutions","Human approval checkpoints and recovery from failed operations","Dashboard for agent decisions, progress and simulated failures"]},
{id:"privacy-agent",title:"Privacy-preserving vision browser agent",domain:"CV / Privacy",icon:"◉",summary:"A browser extension that redacts personal data from screenshots before an AI model chooses the next action.",stack:["JavaScript","Python","FastAPI","Chrome MV3","Transformers.js","Ollama"],details:"Sensitive text and people are detected and redacted on-device so sanitised page context can be sent to a vision model.",features:["Detects email, phone and selected identity-number patterns","On-device people detection and screenshot redaction","Supports local Ollama and OpenAI-compatible model endpoints","Shows redacted regions, actions and latency"]},
{id:"relay",title:"Relay — offline Bluetooth mesh messenger",domain:"Mobile",icon:"⌁",summary:"An Android messenger designed for nearby communication over Bluetooth LE, with Nostr messaging when online.",stack:["Kotlin","Jetpack Compose","BLE","Nostr","Room"],details:"A mobile app project focused on private peer-to-peer communication, with an offline-first approach.",features:["Multi-hop BLE mesh with duplicate suppression and acknowledgements","Encrypted private messages and signed identities","Nostr relays for internet messaging","Android Keystore and Room-backed history"]},
{id:"gemini-chat",title:"Gemini AI chatbot",domain:"Mobile",icon:"✧",summary:"An Android chat app with saved conversations, voice input and a modern Compose interface.",stack:["Kotlin","Jetpack Compose","Gemini"],details:"A student Android project using MVVM, with separate ViewModels and repositories for app state and API calls.",features:["Multiple conversations saved across restarts","Voice input and light/dark themes","Input validation, error handling and retries","Camera and gallery experiments"]},
{id:"lexai",title:"LexAI — Indian law chatbot",domain:"AI / Agents",icon:"§",summary:"A chatbot that explains questions about Indian law in plain language.",stack:["Python","FastAPI"],details:"A legal information chatbot project. Add your exact retrieval approach, data sources and evaluation method here before publishing.",features:["Plain-language legal information","Designed around common questions about Indian law"]},
{id:"codesentinel",title:"CodeSentinel — code intelligence for VS Code",domain:"AI / Agents",icon:"⌘",summary:"A local-first codebase search and review extension using retrieval and local models.",stack:["TypeScript","Node.js","Tree-sitter","Qdrant","Ollama"],details:"Designed to keep source code on the developer's machine. Semantic repository search is the initial focus; review and patch workflows are planned.",features:["Natural-language semantic search across repositories","AST-based parsing with Tree-sitter","Retrieval with Qdrant and local Ollama models","Planned: code review, security analysis and patch previews"],status:"In progress"},

const DOMAINS=["All","AI / Agents","CV / Privacy","Mobile","Systems / DevOps","Full-Stack","Algorithms"];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

<section id="contact"><div class="contact-panel reveal"><div><div class="kicker">Have something in mind?</div><h2>Let's build something useful.</h2><p>Open to learning, collaborating and talking about interesting projects.</p></div><div class="actions"><a class="btn primary" href="mailto:${esc(PROFILE.email)}">Email me ↗</a><a class="btn" href="${esc(PROFILE.github)}" target="_blank" rel="noopener">GitHub ↗</a></div></div></section>`}
let activeFilter="All";
function projectsPage(){const list=PROJECTS.filter(p=>activeFilter==="All"||p.domain===activeFilter);app.innerHTML=`<section id="projects" style="border-top:0"><div class="section-head reveal"><div><div class="kicker">The workbench</div><h2>Projects</h2><p class="lede">Browse projects by area. Open any card for a little more detail.</p></div><span class="project-domain">${list.length} PROJECTS</span></div><div class="filters" role="group" aria-label="Filter projects">${DOMAINS.map(d=>`<button class="chip" data-filter="${esc(d)}" aria-pressed="${d===activeFilter}">${esc(d)}</button>`).join("")}</div><div class="project-grid">${list.map(projectCard).join("")}</div></section>`;app.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;projectsPage()});observeReveals();}
function detailPage(id){const p=PROJECTS.find(x=>x.id===id);if(!p){home();return}app.innerHTML=`<section style="border-top:0"><a class="btn" href="#projects">← Back to projects</a><div class="project-detail"><div class="detail-head"><div><div class="kicker">${esc(p.domain)}${p.status?" · "+esc(p.status):""}</div><h3>${esc(p.title)}</h3></div><span class="project-icon">${p.icon||iconFor(p.domain)}</span></div><p>${esc(p.details)}</p><h4>What it includes</h4><ul>${p.features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul><h4>Tech stack</h4>${tags(p.stack)}<div class="detail-links">${p.github?`<a class="btn" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub ↗</a>`:""}${p.live?`<a class="btn primary" href="${esc(p.live)}" target="_blank" rel="noopener">Live demo ↗</a>`:""}<span class="empty">${!p.github&&!p.live?"Add this project's repository or live demo URL in the PROJECTS data to show a link here.":""}</span></div></div></section>`}
function contactPage(){app.innerHTML=`<section id="contact" style="border-top:0"><div class="contact-panel"><div><div class="kicker">Say hello</div><h2>Let's talk.</h2><p>For collaborations, project feedback or a good technical conversation.</p></div><div class="actions"><a class="btn primary" href="mailto:${esc(PROFILE.email)}">Email me ↗</a><a class="btn" href="${esc(PROFILE.github)}" target="_blank" rel="noopener">GitHub ↗</a><a class="btn" href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a></div></div></section>`}
function route(){const hash=location.hash.slice(1)||"home";if(hash.startsWith("project=")){detailPage(decodeURIComponent(hash.slice(8)));setTab("projects")}else if(hash==="projects"){projectsPage();setTab("projects")}else if(hash==="about"){home();setTab("about");setTimeout(()=>$("#about")?.scrollIntoView(),0)}else if(hash==="contact"){contactPage();setTab("contact")}else{home();setTab("home")}document.title=(hash.startsWith("project=")?PROJECTS.find(p=>p.id===decodeURIComponent(hash.slice(8)))?.title+" — ":"")+"Kik — CS student & builder";window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});observeReveals()}
function setTab(tab){document.querySelectorAll("[data-tab]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.tab===tab))}
addEventListener("hashchange",route);
const root=document.documentElement,themeBtn=$("#theme");
function setTheme(t,save){root.dataset.theme=t;themeBtn.textContent=t==="dark"?"☼ Light":"☾ Dark";if(save){try{localStorage.setItem("portfolio-theme",t)}catch(e){}}}
let theme="dark";try{theme=localStorage.getItem("portfolio-theme")||"dark"}catch(e){}setTheme(theme,false);
themeBtn.onclick=()=>setTheme(root.dataset.theme==="dark"?"light":"dark",true);
$("#year").textContent=new Date().getFullYear();
let revealObserver;
function observeReveals(){if(revealObserver)revealObserver.disconnect();if("IntersectionObserver"in window){revealObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");revealObserver.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".reveal").forEach(el=>revealObserver.observe(el))}else document.querySelectorAll(".reveal").forEach(el=>el.classList.add("visible"))}
route();
</script>
</body>
</html>
